name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # GPUI pulls font-kit and a Linux backend (x11/wayland). aws-lc-sys
      # (russh's crypto backend) needs cmake + a C toolchain. Anything in
      # this list that's already on the runner image is a fast no-op.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb-xkb-dev \
            libssl-dev \
            pkg-config \
            cmake \
            clang

      - name: Start SSH test container
        run: docker compose -f docker/sshd/compose.yml up -d --build --wait

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Stop SSH test container
        if: always()
        run: docker compose -f docker/sshd/compose.yml down -v
