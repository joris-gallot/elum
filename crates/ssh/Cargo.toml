[package]
name = "ssh"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
russh = { version = "0.60", features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
flume = "0.11"
anyhow = "1"
async-trait = "0.1"
dirs = "5"

[dev-dependencies]
tempfile = "3"
